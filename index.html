const DATA=[{"title":"Hand This File to ChatGPT Work","summary":"The agent reads the blueprint, builds the setup plan, asks for needed human actions, and starts implementation.","detailHtml":"<p>Once this file is handed to a ChatGPT Work session or implementation agent, that agent becomes the setup orchestrator.</p>\n    <ol class=\"setup-list\">\n      <li><strong>Read the blueprint.</strong> Turn it into a firm-specific implementation checklist and sequence.</li>\n      <li><strong>Ask only what is missing.</strong> Confirm current software, project storage, CAD/BIM, accounting, email/calendar, team roles and priorities.</li>\n      <li><strong>Use humans where required.</strong> Pause for account creation, billing approval, email invitations, MFA, provider sign-ins and OAuth/admin consent.</li>\n      <li><strong>Verify and continue.</strong> Confirm each workspace, seat, app connection and permission before moving to the next step.</li>\n      <li><strong>Build the first working pilot.</strong> Configure the shared agents, project memory and initial architecture workflows, then test them with the team.</li>\n    </ol>\n    <p class=\"quiet-note\">Humans should enter passwords, payment information and MFA directly in the provider’s secure page—not in the chat. The agent coordinates the process and resumes after each required human action.</p>"},{"title":"Set Up the Shared AI Workspace","summary":"AI guides Business signup, team invites, desktop/mobile installs, billing, and connections to the firm’s existing software.","detailHtml":"<p><strong>Start with one ChatGPT Business workspace for the firm.</strong> ChatGPT Work is included with Business; it is not a separate subscription.</p>\n    <div class=\"setup-block\">\n      <h3>Recommended starting configuration</h3>\n      <p>Use a <strong>Premium Business seat</strong> for the person doing the heaviest AI implementation work, and <strong>Standard Business seats</strong> for the rest of the team. Seats can be mixed and changed later as actual usage becomes clear.</p>\n      <p>Current U.S. Business pricing: Standard is <strong>$20/user/month billed annually</strong> or <strong>$25 monthly</strong>; Premium is <strong>$100/user/month billed annually</strong> or <strong>$125 monthly</strong>. A new Business workspace requires at least two paid seats.</p>\n    </div>\n    <ol class=\"setup-list\">\n      <li>Open ChatGPT Business and create the firm workspace.</li>\n      <li>Choose the initial Standard/Premium seat mix and complete billing.</li>\n      <li>Go to <strong>Workspace settings → Members</strong>, invite the team by email, and assign roles/seats.</li>\n      <li>Every person accepts the invite and confirms they are working inside the same Business workspace.</li>\n      <li>Install ChatGPT on each work computer and mobile device; use the web app as well. Sign into the same account and switch to the Business workspace.</li>\n      <li>Confirm ChatGPT Work is available to the team and that the primary implementation operator has enough usage capacity.</li>\n      <li>The agent inventories the firm’s current apps and asks which are authoritative: Google Workspace or Microsoft 365, file storage, QuickBooks, e-sign, meetings, Slack, CAD/BIM, rendering and any other tools.</li>\n      <li>Connect approved Plugins/Apps. When a provider requires sign-in, MFA or admin approval, the agent gives the exact step and waits. If a native connection is unavailable, it proposes the approved API/custom connector path instead of pretending it is connected.</li>\n    </ol>\n    <div class=\"official-links\">\n      <a href=\"https://chatgpt.com/business/\" target=\"_blank\" rel=\"noopener\">Start ChatGPT Business ↗</a>\n      <a href=\"https://openai.com/business/pricing/\" target=\"_blank\" rel=\"noopener\">Business pricing ↗</a>\n      <a href=\"https://chatgpt.com/download/\" target=\"_blank\" rel=\"noopener\">Download ChatGPT ↗</a>\n    </div>\n    <p class=\"quiet-note\">For a shared firm workspace, Business is the cleaner starting point than buying separate individual Pro subscriptions. Upgrade seat capacity later if real usage requires it.</p>"},{"title":"AI Project Intake & Setup","summary":"AI turns a new inquiry into a ready-to-work project before the team starts designing.","detail":"AI extracts the client, site, program, goals, timing, budget assumptions and contacts from emails, calls and notes; creates the project brief; proposes the folder structure, meeting cadence and next actions; and routes anything missing to the right person."},{"title":"AI Site & Zoning Preflight","summary":"AI assembles the site facts and code constraints the team normally has to hunt down manually.","detail":"AI organizes surveys, existing-condition information, photos, prior permits and approvals, then researches and structures FAR, setbacks, height, massing, Residential Design Standards, top-of-slope, stream-margin and other project-specific constraints into a design-ready preflight for architect review."},{"title":"AI Sketch → Editable 3D","summary":"AI turns John’s pencil sketch into structured geometry without replacing the original design intent.","detail":"AI preserves the original sketch, identifies whether it is a plan, section, elevation or perspective, separates known dimensions from inferred geometry, creates structured 2D, and produces an editable 3D proposal. The team verifies dimensions before anything becomes authoritative CAD/BIM."},{"title":"AI Concept Package Production","summary":"AI turns design direction into comparable A / B / C concept packages in a fraction of the manual production time.","detail":"From the same brief, site and program, AI helps produce three clearly differentiated concept packages with plans, massing, views, material direction, assumptions, relative complexity and presentation graphics. The architect directs the design; AI accelerates the production and comparison."},{"title":"AI Client Review & Approvals","summary":"AI builds the client presentation, explains the decisions, records feedback, and updates the project record.","detail":"AI gathers the current plans, model views, renderings, materials, cost/scope impacts and open questions into one review package. After the meeting it records approve, revise or hybrid decisions against the exact version and creates the downstream tasks automatically."},{"title":"AI Schematic Design & DD Support","summary":"AI carries approved decisions forward so plans, sections, rooms, materials and coordination stay aligned.","detail":"As the project moves through SD and DD, AI checks that the selected concept, client decisions, area targets, room requirements, model views, specifications and consultant inputs remain synchronized. It flags conflicts and prepares the next coordination work instead of relying on someone to remember every dependency."},{"title":"AI Construction Document QA","summary":"AI checks sheets, model views, schedules and specifications before the architect releases the set.","detail":"AI scans for stale views, missing approvals, unresolved dimensions, sheet/spec inconsistencies, superseded information and incomplete coordination. It prepares an issue-readiness report and correction list; the architect remains the release authority."},{"title":"AI Specifications & Vendor Research","summary":"AI researches products, compares quotes, tracks lead times, and keeps the finish schedule current.","detail":"AI gathers manufacturer data, product options, finishes, dimensions, costs, vendors, lead times, alternates, utility requirements and samples into a structured specification schedule. It can normalize competing quotes and flag stale pricing or long-lead risks for review."},{"title":"AI Visualization & Presentations","summary":"AI regenerates renderings, diagrams and client boards when the design changes instead of rebuilding them by hand.","detail":"AI reuses approved camera views, visual direction, materials and presentation templates to update stills, diagrams, interactive 3D and presentation boards from the latest design. This makes design communication faster while keeping the visual language consistent."},{"title":"AI Consultant Coordination","summary":"AI sends the right backgrounds, compares returned files, and surfaces coordination conflicts for the team.","detail":"AI tracks which model/drawing version each consultant received, what was requested and when it is due. When structural, MEP or civil information comes back, AI compares it with the prior issue, identifies meaningful changes and creates targeted coordination items for Joel or John."},{"title":"AI Permit & AHJ Management","summary":"AI tracks the permit path, turns reviewer comments into tasks, and prepares coordinated response packages.","detail":"AI maintains the jurisdiction checklist, submission history, reviewer comments, hearings and permit status. Each comment is linked to the affected sheet or model area, assigned to an owner, tracked through revision, and assembled into a response matrix for architect review."},{"title":"AI Construction Administration","summary":"AI triages RFIs, submittals, substitutions and site issues against the current contract documents.","detail":"AI reads incoming contractor questions, finds the relevant drawing/spec/model context, identifies schedule or scope implications, drafts the response package and routes it for professional review. Site notes and verbal direction can also be converted into a traceable written project record."},{"title":"AI Email, Meetings & Project Memory","summary":"AI converts daily communication into decisions, tasks, risks and follow-ups so nothing lives only in someone’s inbox.","detail":"AI reads project email, meeting notes, voice notes and site conversations; matches them to the correct project; classifies what matters; drafts follow-ups; creates tasks and decision records; and keeps the authoritative project memory current."},{"title":"AI Practice Coordination & Daily Briefs","summary":"AI moves work between roles automatically and gives each person the daily actions that actually need human attention.","detail":"Specialist agents hand work from intake to model QA, specifications, consultant coordination, client reporting and billing without manual forwarding. John receives design/client decisions and critical risks; Joel gets model/production and consultant items; Jodie gets time, contracts, invoice readiness and receivables; Nick gets project health, stalled handoffs and automation issues."},{"title":"AI Scope, Time & Billing","summary":"AI catches added scope, prepares change orders, organizes time, and makes invoices ready for QuickBooks.","detail":"AI compares new requests with the approved scope, flags potential additional services before uncontracted work proceeds, suggests/captures time from project activity, applies the correct rate version, assembles change-order support and prepares invoice-ready data for accounting review."},{"title":"AI Client Portal & Lead Concierge","summary":"AI answers routine client and prospect questions without exposing private firm information.","detail":"The public AI concierge can explain the firm, process and portfolio, collect project basics and qualify inquiries. Authenticated clients can ask for current approved files, open decisions, schedules and project status within their own project only."},{"title":"AI Closeout, Firm Memory & Marketing","summary":"AI closes the project cleanly, preserves what the firm learned, and repurposes approved work for marketing.","detail":"AI assembles final issued drawings/models, specifications, warranties, approvals, consultant records and billing status; extracts reusable lessons and precedent; and, with approval, organizes project imagery and story material for case studies, awards, website updates and marketing."},{"title":"Two Ways to Build the Same System","summary":"Both paths are agent-led. The paid path adds hands-on implementation for the fastest, most robust and reliable launch.","detailHtml":"<p><strong>Both paths begin the same way:</strong> hand this file to ChatGPT Work or the designated implementation agent. The agent owns the onboarding sequence, asks for the required human actions, verifies the workspace and app connections, and builds toward the agreed pilot.</p>\n    <div class=\"path-compare\">\n      <div><h3>Free path with Nicholas</h3><p>$0 implementation fee. The agent drives the setup plan and the firm performs the necessary sign-ups, invitations, billing, permissions and app authorizations with Nicholas helping guide the process.</p></div>\n      <div><h3>Paid implementation</h3><p>$5,000 ($1,000 to begin, $4,000 at scoped delivery) for hands-on buildout, integrations, configuration, testing, QA/QC, team onboarding, workflow refinement and launch—the fastest, most robust and reliable route.</p></div>\n    </div>\n    <p>Optional ongoing consulting: $250–$700/month. Third-party software, API, hosting and provider subscription charges remain separate.</p>"}];

const SPEC=[["exterior-gable",9,"front"],["plan-dashboard",18,"back"],["plan-open",16,"back"],["site-slope",22,"back"],["section-stair",18,"front"],["exterior-pavilions",15,"back"],["living-room",13,"front"],["plan-dd",24,"back"],["section-doc",27,"back"],["materials-wall",19,"front"],["living-gallery",20,"front"],["plan-consultant",23,"back"],["site-permit",28,"back"],["section-ca",16,"front"],["team-network",12,"back"],["systems-network",17,"back"],["billing-ledger",11,"front"],["living-portal",14,"front"],["data-archive",21,"back"],["exterior-offer",10,"front"]];

const main=document.querySelector('main'),nav=document.querySelector('.nav'),dlg=document.querySelector('dialog'),db=dlg.querySelector('.dbody'),dt=dlg.querySelector('.dtitle'),cur=document.querySelector('.current');
const L=(x1,y1,x2,y2,c='soft')=>'<line class="'+c+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>';
const R=(x,y,w,h,c='soft')=>'<rect class="'+c+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'"/>';
const P=(d,c='soft')=>'<path class="'+c+'" d="'+d+'"/>';
const C=(x,y,r,c='soft')=>'<circle class="'+c+'" cx="'+x+'" cy="'+y+'" r="'+r+'"/>';
function seeded(i,n){let x=Math.sin((i+1)*12.9898+n*78.233)*43758.5453;return x-Math.floor(x)}
function architecture(kind,i,count){
  const far=[],mid=[],near=[]; const a=i%2?'olive':'slate';
  function add(arr,s){arr.push(s)}
  const sx=seeded(i,1), sy=seeded(i,2);
  if(kind.includes('exterior')||kind.includes('house')||kind.includes('elevation')){
    add(mid,L(120,590,880,590,'ink'));
    const split=380+Math.round((sx-.5)*80), peak=180+Math.round(sy*70);
    add(mid,P('M150 590V350L'+split+' '+peak+'L555 350V590','ink'));
    add(mid,P('M555 590V385L710 '+(peak+55)+'L850 385V590',a));
    add(mid,R(230,410,95,70,'soft'));add(mid,R(600,430,110,65,'soft'));add(mid,R(735,430,70,65,'soft'));
    add(near,L(400,590,400,458,'warm')); add(near,L(420,590,420,458,'warm'));
    add(far,L(90,625,910,625,'soft'));
  } else if(kind.includes('living')||kind.includes('hearth')||kind.includes('room')||kind.includes('gallery')||kind.includes('portal')){
    const vpX=500+Math.round((sx-.5)*120), vpY=235+Math.round((sy-.5)*55);
    add(mid,L(150,610,vpX,vpY,'ink'));add(mid,L(850,610,vpX,vpY,'ink'));add(mid,L(150,110,vpX,vpY,'soft'));add(mid,L(850,110,vpX,vpY,'soft'));
    add(mid,L(150,110,150,610,'ink'));add(mid,L(850,110,850,610,'ink'));
    add(mid,R(385,350,230,210,a));
    if(kind.includes('hearth')){add(mid,R(430,390,140,150,'ink'));add(near,L(430,390,500,335,'warm'));add(near,L(570,390,500,335,'warm'))}
    if(kind.includes('gallery')){for(let k=0;k<5;k++)add(far,L(230+k*70,520-k*42,310+k*52,480-k*42,'soft'))}
    add(near,L(150,610,850,610,'warm'));
  } else if(kind.includes('site')||kind.includes('terrace')||kind.includes('court')){
    add(mid,R(135,110,730,520,'ink'));
    for(let k=0;k<4;k++)add(far,P('M160 '+(480+k*35)+' C280 '+(380+k*25)+',390 '+(410+k*18)+',500 '+(430+k*20)+' S690 '+(500+k*12)+',835 '+(350+k*28),'soft'));
    add(mid,R(350,260,300,180,a)); add(mid,R(410,315,180,75,'ink'));
    add(near,C(260,250,48,'warm'));add(near,C(720,480,58,'warm'));
  } else if(kind.includes('axon')||kind.includes('stack')){
    add(mid,P('M250 260L500 130L750 260L500 395Z','ink'));
    add(mid,P('M250 260V520L500 650V395','soft'));add(mid,P('M750 260V520L500 650V395',a));
    add(far,P('M320 330L500 235L680 330L500 425Z','soft'));
    add(near,L(500,130,500,235,'warm'));
  } else if(kind.includes('plan')||kind.includes('grid')||kind.includes('ledger')||kind.includes('data')||kind.includes('contract')||kind.includes('archive')||kind.includes('materials')){
    add(mid,R(160,120,680,500,'ink'));
    const cols=2+(i%3), rows=3+(i%4);
    for(let c=1;c<cols;c++)add(mid,L(160+c*(680/cols),120,160+c*(680/cols),620,c===1?a:'soft'));
    for(let r=1;r<rows;r++)add(mid,L(160,120+r*(500/rows),840,120+r*(500/rows),r===2?a:'soft'));
    add(near,R(205,165,110,70,'warm'));
  } else if(kind.includes('section')||kind.includes('stair')||kind.includes('split')){
    add(mid,L(120,600,880,600,'ink'));
    add(mid,L(180,600,180,270,'ink')); add(mid,L(820,600,820,320,'ink'));
    add(mid,P('M180 270L370 150L515 270L670 205L820 320','ink'));
    for(let k=0;k<5;k++)add(near,L(330+k*52,545-k*42,382+k*52,545-k*42,'warm'));
    add(far,L(180,420,820,420,'soft'));
  } else {
    // diagram / workflow / network
    const nodes=4+(i%4);
    for(let n=0;n<nodes;n++){
      const x=180+n*(640/(nodes-1)),y=320+Math.round((seeded(i,n+4)-.5)*120);
      add(mid,C(x,y,30,n===Math.floor(nodes/2)?a:'ink'));
      if(n>0){const px=180+(n-1)*(640/(nodes-1)),py=320+Math.round((seeded(i,n+3)-.5)*120);add(mid,L(px+30,py,x-30,y,'soft'))}
    }
    add(far,L(120,500,880,500,'soft'));add(near,L(500,170,500,250,'warm'));
  }

  // unique sparse supplemental lines: total visual complexity remains 5-40.
  let used=far.length+mid.length+near.length;
  const target=Math.max(5,Math.min(40,count));
  let n=0;
  while(used<target){
    const r1=seeded(i,n+20),r2=seeded(i,n+40),r3=seeded(i,n+60),r4=seeded(i,n+80);
    const x1=110+Math.round(r1*780), y1=100+Math.round(r2*530);
    let x2,y2;
    if(n%3===0){x2=x1;y2=100+Math.round(r4*530)}
    else if(n%3===1){x2=110+Math.round(r3*780);y2=y1}
    else{x2=110+Math.round(r3*780);y2=100+Math.round(r4*530)}
    const arr=n%4===0?far:(n%5===0?near:mid);
    add(arr,L(x1,y1,x2,y2,n%6===0?a:'soft')); used++; n++;
  }
  return '<svg viewBox="0 0 1000 760"><g class="far">'+far.join('')+'</g><g class="mid">'+mid.join('')+'</g><g class="near">'+near.join('')+'</g></svg>';
}
function scene(i){

}

document.querySelector('.index').onclick=()=>nav.classList.add('open');document.querySelector('.navclose').onclick=()=>nav.classList.remove('open');document.querySelector('.close').onclick=()=>dlg.close();

function cl(v,a=0,b=1){return Math.max(a,Math.min(b,v))}
function sm(a,b,x){let t=cl((x-a)/(b-a));return t*t*(3-2*t)}
let tick=false;
function render(){
  const H=main.clientHeight,max=Math.max(1,main.scrollHeight-H);document.querySelector('#progress').style.width=(main.scrollTop/max*100)+'%';
  let best,bf=-1;
  [...main.children].forEach((s,i)=>{
    const r=s.getBoundingClientRect(),mr=main.getBoundingClientRect(),top=r.top-mr.top,p=cl((H-top)/(H+r.height)),delta=top+r.height/2-H/2,f=cl(1-Math.abs(delta)/(H*.72));
    if(f>bf){bf=f;best=s}
    const depth=s.dataset.depth;

    // Focal choreography: design first, then text. When text sharpens, drawing recedes.
    const designIn=sm(.02,.28,p), textIn=sm(.20,.48,p), designOut=1-sm(.68,.96,p), textOut=1-sm(.80,.99,p);
    const dFocus=cl(designIn*designOut), tFocus=cl(textIn*textOut);
    const retreat=sm(.34,.58,p); // begins when text approaches focus

    let farO=.045+dFocus*.10, midO=.10+dFocus*.30, nearO=.018+dFocus*.065;
    let farB=7-3*dFocus, midB=9*(1-dFocus)+retreat*3.6, nearB=14-2*dFocus;
    if(depth==='front'){
      nearO=.03+dFocus*.10; nearB=16-4*dFocus;
      midO=.08+dFocus*.23;
    }else{
      farO=.055+dFocus*.11; midO=.09+dFocus*.25;
    }
    // Once foreground text takes focus, visual contrast drops further.
    midO*=1-.48*tFocus; farO*=1-.28*tFocus; nearO*=1-.18*tFocus;
    midB+=tFocus*2.8;

    s.style.setProperty('--far-o',farO.toFixed(3));s.style.setProperty('--mid-o',midO.toFixed(3));s.style.setProperty('--near-o',nearO.toFixed(3));
    s.style.setProperty('--far-b',farB.toFixed(2)+'px');s.style.setProperty('--mid-b',midB.toFixed(2)+'px');s.style.setProperty('--near-b',nearB.toFixed(2)+'px');
    s.style.setProperty('--tx-o',(0.72+tFocus*.28).toFixed(3));s.style.setProperty('--tx-b',(4.4*(1-tFocus)).toFixed(2)+'px');s.style.setProperty('--tx-y',((1-tFocus)*18 - Math.max(0,p-.82)*8).toFixed(2)+'px');

    // Every scene uses a distinct deterministic camera signature derived from section index.
    const seed=i+1,q=p;
    const dir=i%2?1:-1;
    const ampX=22+(seed%5)*11, ampY=10+(seed%4)*8, ampR=1.2+(seed%6)*.62;
    const x=dir*(q-.5)*ampX*2;
    const y=Math.sin(q*Math.PI*2+seed*.41)*ampY;
    const z=-70+(f*88)-Math.abs(q-.5)*18;
    const rx=Math.sin(q*Math.PI+seed*.23)*ampR*(seed%3===0?1.9:1);
    const ry=dir*(q-.5)*ampR*2.2;
    const rz=Math.sin(q*Math.PI*2+seed*.15)*(seed%4===0?1.05:.35);
    const sc=.982+f*.022+(seed%5===0?(q-.5)*.018:0);
    s.style.setProperty('--cam-x',x.toFixed(2)+'px');s.style.setProperty('--cam-y',y.toFixed(2)+'px');s.style.setProperty('--cam-z',z.toFixed(2)+'px');
    s.style.setProperty('--cam-rx',rx.toFixed(3)+'deg');s.style.setProperty('--cam-ry',ry.toFixed(3)+'deg');s.style.setProperty('--cam-rz',rz.toFixed(3)+'deg');s.style.setProperty('--cam-s',sc.toFixed(4));

    const lx=(-120+240*q)+Math.sin(seed*.7)*30, ly=-28+Math.sin(q*Math.PI)*48+Math.cos(seed*.5)*10;
    s.style.setProperty('--light-x',lx.toFixed(1)+'px');s.style.setProperty('--light-y',ly.toFixed(1)+'px');s.style.setProperty('--light-o',(.018+dFocus*.052+tFocus*.012).toFixed(3));
  });
  if(best)cur.textContent=best.querySelector('h1').textContent;
  tick=false
}
main.onscroll=()=>{if(!tick){requestAnimationFrame(render);tick=true}};onresize=render;render();requestAnimationFrame(render);
