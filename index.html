const DATA=[{"title":"Free Architecture AI Blueprint","summary":"Use this master internally for free. No setup fee or subscription is required.","detail":"This is a complete self-build blueprint for the Galambos team. It can be used internally with ChatGPT Work / Codex without a paid implementation package or ongoing subscription."},{"title":"Project Intake & Setup","summary":"Turn a new inquiry into a project brief, contacts, scope, schedule, folders, and next actions.","detail":"Captures project location, client goals, site status, timing/budget assumptions, contacts, scope, meeting cadence, folder structure and responsible team members. Creates a clean project record before design work starts."},{"title":"Site, Existing Conditions & Zoning","summary":"Organize surveys, photos, dimensions, zoning, FAR, setbacks, prior approvals, and site constraints before design begins.","detail":"Combines site capture, existing permitted conditions, slope/topography, views/sun, zoning, Residential Design Standards, height/massing, stream/top-of-slope constraints and prior approvals into one design preflight."},{"title":"John’s Sketch → Editable 3D","summary":"Photograph a hand sketch, preserve it as the source, and turn verified dimensions into editable CAD/BIM geometry.","detail":"The original sketch stays untouched. The system classifies plan/elevation/section/perspective, marks known versus inferred dimensions, creates structured 2D, then an editable 3D proposal in the configured CAD/BIM stack. Human verification is required before it becomes authoritative geometry."},{"title":"Concept Design A / B / C","summary":"Develop three materially different schemes from the same brief, site, program, and budget assumptions.","detail":"Each option carries a design thesis, spatial approach, material direction, relative cost/complexity, assumptions, model views and open questions. The client can select, hybridize or request revision without losing version history."},{"title":"Client Review & Design Approval","summary":"Package plans, model views, renders, materials, impacts, and open decisions into one approval set.","detail":"Every client decision is tied to an exact artifact and version. Approve, approve-with-notes, revise or hybrid selections are recorded with person, date, notes and downstream impact."},{"title":"Schematic Design → Design Development","summary":"Carry the selected concept into coordinated plans, elevations, sections, rooms, materials, and technical design.","detail":"The selected concept becomes increasingly resolved geometry and documentation while preserving design intent, area/dimension checks, client decisions, coordination issues and consultant inputs."},{"title":"Construction Documents & Release QA","summary":"Assemble issue-ready drawings, schedules, details, specifications, and model references—and check them before release.","detail":"Release QA checks version lineage, missing approvals, stale model views, unresolved dimensions, sheet/spec consistency and required professional review before anything is issued."},{"title":"Specifications, Materials & Vendors","summary":"Track products, finishes, alternates, samples, quotes, utilities, lead times, and approvals in one schedule.","detail":"Each item can include manufacturer/product/finish, dimensions, quantity, cost, source, vendor, lead time, freshness, utilities/install requirements, alternates and approval status."},{"title":"Architectural Visualization & Presentation","summary":"Regenerate renderings, interactive 3D, diagrams, boards, and client packages from the latest approved design.","detail":"Render cameras, visual style, material presets and presentation templates can be reused so revisions do not require rebuilding the presentation from scratch. Supports stills, motion studies, interactive 3D and client decision boards."},{"title":"Consultant Coordination","summary":"Issue the correct backgrounds, collect structural/MEP/civil updates, compare revisions, and route coordination items.","detail":"Every consultant issue records the exact source version, requested deliverable, due date and response. Incoming files are compared against the prior issue and create targeted coordination items instead of broad manual review."},{"title":"Permit & AHJ Management","summary":"Track jurisdiction, submittals, reviewer comments, response matrices, hearings, revisions, and permit status.","detail":"Maintains one regulatory record from preflight through permit. Comments become owned response items linked to affected sheets/model areas, supporting evidence, resubmission date and closure status."},{"title":"Construction Administration","summary":"Organize RFIs, submittals, substitutions, site observations, punch items, and contractor questions against current documents.","detail":"Incoming CA items are classified, linked to relevant drawing/spec/model context, assigned, reviewed, issued and tracked for schedule or scope impact. Verbal site direction is converted into written project record."},{"title":"Project Communication & Meeting Memory","summary":"Turn email, meetings, voice notes, and site conversations into decisions, tasks, questions, risks, and follow-ups.","detail":"Communication is matched to the correct project and classified. Meetings generate agenda/pre-read, decisions, tasks, scope changes and reviewed follow-up. The project record owns the action, not the inbox."},{"title":"AI Project Team & Automatic Handoffs","summary":"Let specialist agents move work between Nick, Joel, John, and Jodie without manual forwarding.","detail":"The Control Tower routes work to design, model QC, specs, consultant, billing and reporting agents. Deterministic handoffs continue automatically; design judgment, professional release, client sends and financial commitments still stop for the appropriate human."},{"title":"Principal & Team Command Center","summary":"Give each person a role-specific daily view of exactly what needs their attention.","detail":"John sees design/client decisions and critical risks. Joel sees production, model and consultant coordination. Jodie sees time, contracts, invoice readiness and receivables. Nick sees project health, handoffs, stalled work and automation failures."},{"title":"Scope, Time, Change Orders & QuickBooks","summary":"Detect added scope, suggest time, prepare change orders and invoices, and reconcile QuickBooks.","detail":"Every time entry snapshots the correct rate version. Scope changes are compared with the approved baseline before work proceeds. Invoice payloads assemble approved time, fees, expenses and change orders for accounting."},{"title":"Client Portal & Website Concierge","summary":"Give clients a secure project view—and give prospects a public assistant that explains the firm and qualifies leads.","detail":"Authenticated clients can see current approved files, open decisions, schedules and uploads for their project only. The public website assistant answers firm/process questions, gathers project basics and routes qualified inquiries to the team."},{"title":"Closeout, Firm Memory & Marketing","summary":"Archive final project records, capture lessons, and turn approved finished-project assets into reusable firm knowledge.","detail":"Closeout collects final issued sets/models, specs, warranties, approvals, consultant records and final billing. Lessons become searchable precedent. With permission, photography, rendering and video assets can flow into case studies, website, awards and marketing."},{"title":"Build It Your Way","summary":"Self-build for free—or choose Nicholas-led implementation for the fastest, most reliable launch.","detail":"Self-build: $0 implementation fee using this complete blueprint. Nicholas-led implementation: $5,000 ($1,000 to begin, $4,000 at scoped delivery) for a faster, more reliable rollout with setup, integration, QA/QC, team onboarding, workflow refinement and launch support. Optional ongoing consulting: $250–$700/month. Third-party software/API/hosting and separately scoped photography, website, rendering or media work remain separate."}];

const SPEC=[["exterior-gable",9,"front"],["plan-open",16,"back"],["site-slope",22,"back"],["section-stair",18,"front"],["exterior-pavilions",15,"back"],["living-room",13,"front"],["plan-dd",24,"back"],["section-doc",27,"back"],["materials-wall",19,"front"],["living-gallery",20,"front"],["plan-consultant",23,"back"],["site-permit",28,"back"],["section-ca",16,"front"],["team-network",12,"back"],["systems-network",17,"back"],["plan-dashboard",14,"front"],["billing-ledger",11,"front"],["living-portal",14,"front"],["data-archive",21,"back"],["exterior-offer",10,"front"]];

const main=document.querySelector('main'),nav=document.querySelector('.nav'),dlg=document.querySelector('dialog'),db=dlg.querySelector('.dbody'),dt=dlg.querySelector('.dtitle'),cur=document.querySelector('.current');
const L=(x1,y1,x2,y2,c='soft')=>'<line class="'+c+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>';
const R=(x,y,w,h,c='soft')=>'<rect class="'+c+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'"/>';
const P=(d,c='soft')=>'<path class="'+c+'" d="'+d+'"/>';
const C=(x,y,r,c='soft')=>'<circle class="'+c+'" cx="'+x+'" cy="'+y+'" r="'+r+'"/>';
function seeded(i,n){let x=Math.sin((i+1)*12.9898+n*78.233)*43758.5453;return x-Math.floor(x)}
function architecture(kind,i,count){
  const far=[],mid=[],near=[]; const a=i%2?'olive':'slate';
  function add(arr,s){arr.push(s)}
  const sx=seeded(i,1), sy=seeded(i,2);
  if(kind.includes('exterior')||kind.includes('house')||kind.includes('elevation')){
    add(mid,L(120,590,880,590,'ink'));
    const split=380+Math.round((sx-.5)*80), peak=180+Math.round(sy*70);
    add(mid,P('M150 590V350L'+split+' '+peak+'L555 350V590','ink'));
    add(mid,P('M555 590V385L710 '+(peak+55)+'L850 385V590',a));
    add(mid,R(230,410,95,70,'soft'));add(mid,R(600,430,110,65,'soft'));add(mid,R(735,430,70,65,'soft'));
    add(near,L(400,590,400,458,'warm')); add(near,L(420,590,420,458,'warm'));
    add(far,L(90,625,910,625,'soft'));
  } else if(kind.includes('living')||kind.includes('hearth')||kind.includes('room')||kind.includes('gallery')||kind.includes('portal')){
    const vpX=500+Math.round((sx-.5)*120), vpY=235+Math.round((sy-.5)*55);
    add(mid,L(150,610,vpX,vpY,'ink'));add(mid,L(850,610,vpX,vpY,'ink'));add(mid,L(150,110,vpX,vpY,'soft'));add(mid,L(850,110,vpX,vpY,'soft'));
    add(mid,L(150,110,150,610,'ink'));add(mid,L(850,110,850,610,'ink'));
    add(mid,R(385,350,230,210,a));
    if(kind.includes('hearth')){add(mid,R(430,390,140,150,'ink'));add(near,L(430,390,500,335,'warm'));add(near,L(570,390,500,335,'warm'))}
    if(kind.includes('gallery')){for(let k=0;k<5;k++)add(far,L(230+k*70,520-k*42,310+k*52,480-k*42,'soft'))}
    add(near,L(150,610,850,610,'warm'));
  } else if(kind.includes('site')||kind.includes('terrace')||kind.includes('court')){
    add(mid,R(135,110,730,520,'ink'));
    for(let k=0;k<4;k++)add(far,P('M160 '+(480+k*35)+' C280 '+(380+k*25)+',390 '+(410+k*18)+',500 '+(430+k*20)+' S690 '+(500+k*12)+',835 '+(350+k*28),'soft'));
    add(mid,R(350,260,300,180,a)); add(mid,R(410,315,180,75,'ink'));
    add(near,C(260,250,48,'warm'));add(near,C(720,480,58,'warm'));
  } else if(kind.includes('axon')||kind.includes('stack')){
    add(mid,P('M250 260L500 130L750 260L500 395Z','ink'));
    add(mid,P('M250 260V520L500 650V395','soft'));add(mid,P('M750 260V520L500 650V395',a));
    add(far,P('M320 330L500 235L680 330L500 425Z','soft'));
    add(near,L(500,130,500,235,'warm'));
  } else if(kind.includes('plan')||kind.includes('grid')||kind.includes('ledger')||kind.includes('data')||kind.includes('contract')||kind.includes('archive')||kind.includes('materials')){
    add(mid,R(160,120,680,500,'ink'));
    const cols=2+(i%3), rows=3+(i%4);
    for(let c=1;c<cols;c++)add(mid,L(160+c*(680/cols),120,160+c*(680/cols),620,c===1?a:'soft'));
    for(let r=1;r<rows;r++)add(mid,L(160,120+r*(500/rows),840,120+r*(500/rows),r===2?a:'soft'));
    add(near,R(205,165,110,70,'warm'));
  } else if(kind.includes('section')||kind.includes('stair')||kind.includes('split')){
    add(mid,L(120,600,880,600,'ink'));
    add(mid,L(180,600,180,270,'ink')); add(mid,L(820,600,820,320,'ink'));
    add(mid,P('M180 270L370 150L515 270L670 205L820 320','ink'));
    for(let k=0;k<5;k++)add(near,L(330+k*52,545-k*42,382+k*52,545-k*42,'warm'));
    add(far,L(180,420,820,420,'soft'));
  } else {
    // diagram / workflow / network
    const nodes=4+(i%4);
    for(let n=0;n<nodes;n++){
      const x=180+n*(640/(nodes-1)),y=320+Math.round((seeded(i,n+4)-.5)*120);
      add(mid,C(x,y,30,n===Math.floor(nodes/2)?a:'ink'));
      if(n>0){const px=180+(n-1)*(640/(nodes-1)),py=320+Math.round((seeded(i,n+3)-.5)*120);add(mid,L(px+30,py,x-30,y,'soft'))}
    }
    add(far,L(120,500,880,500,'soft'));add(near,L(500,170,500,250,'warm'));
  }

  // unique sparse supplemental lines: total visual complexity remains 5-40.
  let used=far.length+mid.length+near.length;
  const target=Math.max(5,Math.min(40,count));
  let n=0;
  while(used<target){
    const r1=seeded(i,n+20),r2=seeded(i,n+40),r3=seeded(i,n+60),r4=seeded(i,n+80);
    const x1=110+Math.round(r1*780), y1=100+Math.round(r2*530);
    let x2,y2;
    if(n%3===0){x2=x1;y2=100+Math.round(r4*530)}
    else if(n%3===1){x2=110+Math.round(r3*780);y2=y1}
    else{x2=110+Math.round(r3*780);y2=100+Math.round(r4*530)}
    const arr=n%4===0?far:(n%5===0?near:mid);
    add(arr,L(x1,y1,x2,y2,n%6===0?a:'soft')); used++; n++;
  }

}
function scene(i){
  const [kind,count,depth]=SPEC[i];
  return '<div class="space '+depth+'"><div class="light"></div><div class="shade"></div>'+architecture(kind,i,count)+'</div>';
}
DATA.forEach((d,i)=>{
  const s=document.createElement('section');s.dataset.i=i;s.dataset.depth=SPEC[i][2];s.dataset.kind=SPEC[i][0];

  s.querySelector('.more').onclick=()=>{dt.textContent=d.title;db.innerHTML='<h2>'+d.title+'</h2><p>'+d.detail+'</p>'+((i===0||i===DATA.length-1)?'<p class="free"><strong>Free master:</strong> no setup fee or subscription is required. Nicholas-led implementation and ongoing consulting are optional.</p>':'');dlg.showModal()};
  main.appendChild(s);
  const n=document.createElement('a');n.href='#';n.innerHTML='<i>'+String(i+1).padStart(2,'0')+'</i><span>'+d.title+'</span>';n.onclick=e=>{e.preventDefault();main.scrollTo({top:s.offsetTop,behavior:'smooth'});nav.classList.remove('open')};nav.appendChild(n)
});
document.querySelector('.index').onclick=()=>nav.classList.add('open');document.querySelector('.navclose').onclick=()=>nav.classList.remove('open');document.querySelector('.close').onclick=()=>dlg.close();

function cl(v,a=0,b=1){return Math.max(a,Math.min(b,v))}
function sm(a,b,x){let t=cl((x-a)/(b-a));return t*t*(3-2*t)}
let tick=false;
function render(){
  const H=main.clientHeight,max=Math.max(1,main.scrollHeight-H);document.querySelector('#progress').style.width=(main.scrollTop/max*100)+'%';
  let best,bf=-1;
  [...main.children].forEach((s,i)=>{
    const r=s.getBoundingClientRect(),mr=main.getBoundingClientRect(),top=r.top-mr.top,p=cl((H-top)/(H+r.height)),delta=top+r.height/2-H/2,f=cl(1-Math.abs(delta)/(H*.72));
    if(f>bf){bf=f;best=s}
    const depth=s.dataset.depth;

    // Focal choreography: design first, then text. When text sharpens, drawing recedes.
    const designIn=sm(.02,.28,p), textIn=sm(.20,.48,p), designOut=1-sm(.68,.96,p), textOut=1-sm(.80,.99,p);
    const dFocus=cl(designIn*designOut), tFocus=cl(textIn*textOut);
    const retreat=sm(.34,.58,p); // begins when text approaches focus

    let farO=.045+dFocus*.10, midO=.10+dFocus*.30, nearO=.018+dFocus*.065;
    let farB=7-3*dFocus, midB=9*(1-dFocus)+retreat*3.6, nearB=14-2*dFocus;
    if(depth==='front'){
      nearO=.03+dFocus*.10; nearB=16-4*dFocus;
      midO=.08+dFocus*.23;
    }else{
      farO=.055+dFocus*.11; midO=.09+dFocus*.25;
    }
    // Once foreground text takes focus, visual contrast drops further.
    midO*=1-.48*tFocus; farO*=1-.28*tFocus; nearO*=1-.18*tFocus;
    midB+=tFocus*2.8;

    s.style.setProperty('--far-o',farO.toFixed(3));s.style.setProperty('--mid-o',midO.toFixed(3));s.style.setProperty('--near-o',nearO.toFixed(3));
    s.style.setProperty('--far-b',farB.toFixed(2)+'px');s.style.setProperty('--mid-b',midB.toFixed(2)+'px');s.style.setProperty('--near-b',nearB.toFixed(2)+'px');
    s.style.setProperty('--tx-o',(0.72+tFocus*.28).toFixed(3));s.style.setProperty('--tx-b',(4.4*(1-tFocus)).toFixed(2)+'px');s.style.setProperty('--tx-y',((1-tFocus)*18 - Math.max(0,p-.82)*8).toFixed(2)+'px');

    // Every scene uses a distinct deterministic camera signature derived from section index.
    const seed=i+1,q=p;
    const dir=i%2?1:-1;
    const ampX=22+(seed%5)*11, ampY=10+(seed%4)*8, ampR=1.2+(seed%6)*.62;
    const x=dir*(q-.5)*ampX*2;
    const y=Math.sin(q*Math.PI*2+seed*.41)*ampY;
    const z=-70+(f*88)-Math.abs(q-.5)*18;
    const rx=Math.sin(q*Math.PI+seed*.23)*ampR*(seed%3===0?1.9:1);
    const ry=dir*(q-.5)*ampR*2.2;
    const rz=Math.sin(q*Math.PI*2+seed*.15)*(seed%4===0?1.05:.35);
    const sc=.982+f*.022+(seed%5===0?(q-.5)*.018:0);
    s.style.setProperty('--cam-x',x.toFixed(2)+'px');s.style.setProperty('--cam-y',y.toFixed(2)+'px');s.style.setProperty('--cam-z',z.toFixed(2)+'px');
    s.style.setProperty('--cam-rx',rx.toFixed(3)+'deg');s.style.setProperty('--cam-ry',ry.toFixed(3)+'deg');s.style.setProperty('--cam-rz',rz.toFixed(3)+'deg');s.style.setProperty('--cam-s',sc.toFixed(4));

    const lx=(-120+240*q)+Math.sin(seed*.7)*30, ly=-28+Math.sin(q*Math.PI)*48+Math.cos(seed*.5)*10;
    s.style.setProperty('--light-x',lx.toFixed(1)+'px');s.style.setProperty('--light-y',ly.toFixed(1)+'px');s.style.setProperty('--light-o',(.018+dFocus*.052+tFocus*.012).toFixed(3));
  });
  if(best)cur.textContent=best.querySelector('h1').textContent;
  tick=false
}
main.onscroll=()=>{if(!tick){requestAnimationFrame(render);tick=true}};onresize=render;render();requestAnimationFrame(render);
</script></body></html>
