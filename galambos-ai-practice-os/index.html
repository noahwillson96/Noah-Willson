<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Galambos Architects — AI Practice OS</title><style>
:root{--ink:#111;--muted:#777;--line:#e8e8e8;--olive:#707351;--slate:#62747d;--warm:#d7d2c8;--bar:56px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}html{overflow:hidden}body{overflow:hidden}button{font:inherit;color:inherit}#progress{position:fixed;z-index:99;top:0;left:0;height:1px;background:#111;width:0}header{position:fixed;z-index:20;top:0;left:0;right:0;height:var(--bar);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.05)}.brand,.current,.index{font-size:10px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}.brand{font-weight:600}.current{color:var(--muted)}.index{justify-self:end;border:0;background:none;padding:0;cursor:pointer;font-weight:600}.index:after,.more:after{content:' ↗'}main{position:fixed;inset:var(--bar) 0 0;overflow:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:y proximity;overscroll-behavior:contain}section{--x:0px;--y:0px;--z:0px;--rx:0deg;--ry:0deg;--rz:0deg;--sc:1;--vb:0px;--tb:0px;--tf:1;--vf:.5;--lx:0px;--ly:0px;position:relative;height:calc(100svh - var(--bar));min-height:520px;display:grid;place-items:center;overflow:hidden;scroll-snap-align:center;perspective:1400px;border-top:1px solid rgba(0,0,0,.035)}.copy{position:relative;z-index:5;width:min(820px,86vw);text-align:center;transform:translate3d(0,0,145px);filter:blur(var(--tb));opacity:calc(.76 + var(--tf)*.24)}.num{font-size:9px;color:#aaa;letter-spacing:.2em;margin-bottom:20px}h1{font-weight:500;font-size:clamp(38px,7vw,88px);line-height:.93;letter-spacing:-.052em;margin:0 auto;max-width:12ch;text-wrap:balance}.summary{font-size:clamp(15px,1.55vw,19px);line-height:1.45;max-width:44ch;margin:20px auto 0;color:#333;text-wrap:balance}.more{margin-top:24px;border:0;border-bottom:1px solid #111;background:none;padding:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}.space{position:absolute;z-index:1;inset:4vh 3vw;display:grid;place-items:center;transform-style:preserve-3d;transform:translate3d(var(--x),var(--y),var(--z)) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz)) scale(var(--sc));filter:blur(var(--vb));opacity:calc(.22 + var(--vf)*.48);will-change:transform,filter,opacity}svg{width:min(1120px,96vw);height:min(76vh,730px);overflow:visible;transform:translateZ(38px)}svg *{vector-effect:non-scaling-stroke}.ink{stroke:#111;fill:none;stroke-width:1}.soft{stroke:#d8d8d8;fill:none;stroke-width:.82}.olive{stroke:var(--olive);fill:none;stroke-width:1}.slate{stroke:var(--slate);fill:none;stroke-width:1}.guide{stroke:#ececec;fill:none;stroke-width:.7;stroke-dasharray:5 8}.plane,.light{position:absolute;pointer-events:none;will-change:transform,opacity}.plane{border:1px solid rgba(17,17,17,.035)}.a{width:42%;height:34%;left:14%;top:18%;background:rgba(112,115,81,.035);transform:translateZ(-140px)}.b{width:34%;height:44%;right:12%;top:30%;background:rgba(98,116,125,.032);transform:translateZ(-54px)}.c{width:52%;height:19%;left:25%;bottom:9%;background:rgba(215,210,200,.12);transform:translateZ(18px)}.light{width:50vw;height:50vw;max-width:720px;max-height:720px;border-radius:50%;filter:blur(62px);opacity:.055;mix-blend-mode:multiply}.lo{left:-14%;top:-18%;background:radial-gradient(circle,rgba(112,115,81,.48),rgba(112,115,81,.1) 42%,transparent 70%);transform:translate(var(--lx),var(--ly))}.ls{right:-16%;bottom:-24%;background:radial-gradient(circle,rgba(98,116,125,.38),rgba(98,116,125,.09) 42%,transparent 70%);transform:translate(calc(var(--lx)*-.6),calc(var(--ly)*-.5))}dialog{border:0;width:min(900px,100vw);height:100vh;max-width:none;max-height:none;margin:0 0 0 auto;padding:0;background:#fff;color:#111}dialog::backdrop{background:rgba(255,255,255,.72);backdrop-filter:blur(8px)}.dhead{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line)}.dtitle{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.close{border:0;background:none;font-size:25px;padding:0;cursor:pointer}.dbody{padding:52px 7vw 100px;max-width:760px}.dbody h2{font-size:clamp(34px,6vw,62px);line-height:.95;letter-spacing:-.045em;font-weight:500;margin:0 0 24px}.dbody p{font-size:18px;line-height:1.65;color:#333}.free{padding-top:26px;border-top:1px solid var(--line);margin-top:34px;font-size:12px!important;color:#666!important}.nav{position:fixed;z-index:40;inset:0 auto 0 0;width:min(390px,90vw);background:#fff;border-right:1px solid var(--line);transform:translateX(-102%);transition:.32s;padding:76px 24px 40px;overflow:auto}.nav.open{transform:none}.nav a{display:grid;grid-template-columns:34px 1fr;gap:8px;border-bottom:1px solid var(--line);padding:10px 0;font-size:12px}.nav i{font-style:normal;color:#aaa;font-size:9px;letter-spacing:.12em}.navclose{position:absolute;top:20px;right:20px;border:0;background:none;font-size:24px}@media(max-width:760px){:root{--bar:54px}header{grid-template-columns:1fr auto;padding:0 16px}.current{display:none}h1{font-size:clamp(34px,11.5vw,52px);max-width:10ch}.summary{font-size:16px;max-width:31ch}.space{inset:7vh -8vw}svg{width:116vw;height:68vh}.light{width:78vw;height:78vw}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.space,.copy{transform:none!important;filter:none!important;opacity:1!important}}
</style></head><body><div id="progress"></div><header><div class="brand">GALAMBOS ARCHITECTS</div><div class="current">AI Practice Operating System</div><button class="index">Index</button></header><nav class="nav"><button class="navclose">×</button></nav><main></main><dialog><div class="dhead"><div class="dtitle">Details</div><button class="close">×</button></div><div class="dbody"></div></dialog><script>const DATA=[{"title":"Free to use.","summary":"No setup fee. No subscription. Paid help is optional.","detail":"This blueprint can be built internally at the team’s pace. Nicholas-led setup is simply the fastest implementation path."},{"title":"The Firm","summary":"The system understands the practice before it acts.","detail":"Firm knowledge, people, precedents, design intent and project context become usable operating memory."},{"title":"Voice","summary":"Speak it once. Turn it into organized project memory.","detail":"Voice notes can become reviewed requirements, decisions, tasks and project history."},{"title":"Audit","summary":"The baseline that shaped the system.","detail":"The operating plan was stress-tested for missing ownership, tools, handoffs, security and workflow gaps."},{"title":"Start","summary":"Every request begins with the right context.","detail":"The startup agent resolves person, project, configuration, permissions and workflow before taking action."},{"title":"Control","summary":"Tune behavior without rebuilding the system.","detail":"John and Nicholas can adjust workflow, autonomy, notifications, client communication and tool priority."},{"title":"Flow","summary":"Repeatable work becomes reusable workflow.","detail":"Lead intake, discovery, design, billing, CA and closeout become consistent recipes instead of manual reinvention."},{"title":"Tools","summary":"Use the best available tool for each job.","detail":"Agents ask for capabilities while the tool registry selects the approved app, API or fallback."},{"title":"Stress Test","summary":"Challenge the plan before the team depends on it.","detail":"The system questions assumptions, missing evidence and failure cases before important work advances."},{"title":"Authority","summary":"Clear ownership. Clear approvals.","detail":"John, Nick, Joel and Jodie keep distinct responsibilities while agents handle deterministic connective work."},{"title":"Communication","summary":"Messages become actions, decisions, or records.","detail":"Email, meetings, calls and client feedback are normalized into one traceable project system."},{"title":"AI Team","summary":"A few front doors coordinate specialist agents.","detail":"The visible experience stays simple while background agents handle memory, QA, specs, reporting and coordination."},{"title":"Multi-Agent","summary":"Work continues until human judgment is actually needed.","detail":"Tightly coupled agents can hand work forward automatically and pause only at explicit approval gates."},{"title":"Backbone","summary":"A reliable core under a simple experience.","detail":"Project state, files, CAD/BIM, accounting, policy, tool calls and audit history stay separated and authoritative."},{"title":"Possibility","summary":"50 ways to remove friction across the practice.","detail":"From sketch-to-3D and client portals to long-lead alerts, automatic reports and project closeout intelligence."},{"title":"Lifecycle","summary":"One connected path from lead to closeout.","detail":"The project moves through clear states instead of disconnected inboxes, folders and reminders."},{"title":"Experience","summary":"Projects, approvals, files, and billing in one calm view.","detail":"The human interface shows only what matters now; deeper intelligence stays available on demand."},{"title":"Agent Rules","summary":"Each agent has a job, limit, and handoff.","detail":"Versioned manifests define mission, context, tools, approvals, outputs, retries and escalation."},{"title":"Connections","summary":"Email, files, CAD, and finance stay in sync.","detail":"Google or Microsoft, QuickBooks, e-sign, CAD/BIM and specialist tools connect through narrow permissions."},{"title":"Skills","summary":"Reusable capabilities agents call when needed.","detail":"Intake, meetings, 2D-to-3D, specs, vendor research, change orders, billing and closeout become reusable skills."},{"title":"Sketch → 3D","summary":"Keep pencil-first design. Accelerate everything after it.","detail":"John’s hand drawings remain original design evidence while structured interpretation drives editable 2D and 3D."},{"title":"CAD / BIM","summary":"Verified editable geometry remains authoritative.","detail":"AI proposals stay separate from verified baseline geometry until dimensions and model state are checked."},{"title":"Concepts","summary":"Compare options clearly. Capture the decision.","detail":"A/B/C concepts share one brief and make differences, assumptions, impacts and approvals easy to understand."},{"title":"Specs","summary":"Selections, quotes, and lead times stay current.","detail":"Materials, products, alternates, utilities, vendor quotes and freshness live in one structured schedule."},{"title":"Billing","summary":"Time moves cleanly from work to invoice.","detail":"Approved time, rates, fees, expenses and change orders assemble into invoice-ready accounting payloads."},{"title":"Data","summary":"One project state connects every workflow.","detail":"Projects, agents, approvals, artifacts, communication, design, specs, commercial data and audit events share one backbone."},{"title":"Automation","summary":"Routine work continues when it is safe.","detail":"Scheduled and event-driven jobs handle reports, reminders, classification, freshness, reconciliation and handoffs."},{"title":"Metrics","summary":"Measure saved time, delays, and rework.","detail":"Cycle time, decision latency, handoff quality, invoice lag, stale information and automation success become visible."},{"title":"Stack","summary":"Fewer tools. Better connections.","detail":"The recommendation is intentionally modular: one primary system per responsibility, connected cleanly."},{"title":"Files","summary":"Current files stay obvious. History stays traceable.","detail":"Originals, working files, reviewed versions and issued packages retain clear status and lineage."},{"title":"Security","summary":"Sensitive actions stay permissioned and auditable.","detail":"Prompts never grant authority; server policy, project membership, approval gates and tool constraints do."},{"title":"Build","summary":"Move from setup to production in controlled phases.","detail":"Start with configuration and communication, prove multi-agent value, then expand design, billing, CA and client experiences."},{"title":"Tests","summary":"Prove the system before scaling it.","detail":"Identity, isolation, handoffs, approvals, idempotency, recovery, CAD lineage, billing and agent regression are tested."},{"title":"QA / QC","summary":"Know what is ready, open, or blocked.","detail":"The plan separates solved architecture from real firm configuration choices, pilot evidence and unavailable source content."},{"title":"Machine Contract","summary":"Humans and build agents read the same plan.","detail":"The full technical master includes structured machine-readable architecture so implementation agents do not reinterpret the intent."},{"title":"Evidence","summary":"Research behind the architecture.","detail":"The blueprint is grounded in firm-specific research plus current tool and platform capabilities."},{"title":"Build It Your Way","summary":"Free self-build. Optional Nicholas-led setup and support.","detail":"$0 self-build • $5,000 setup + onboarding • optional $250–$700/month ongoing support."}];const MODES=['focus','right','tilt','left','orbitR','pull','rise','cross','orbitL','push','twist','top'];const main=document.querySelector('main'),nav=document.querySelector('.nav'),dlg=document.querySelector('dialog'),body=dlg.querySelector('.dbody'),dt=dlg.querySelector('.dtitle'),cur=document.querySelector('.current');function svg(i){const k=i%6,a=i%3===0?'olive':i%3===1?'slate':'ink';if(k===0)return `<svg viewBox="0 0 1000 760"><g class="guide"><line x1="100" y1="150" x2="900" y2="150"/><line x1="240" y1="80" x2="240" y2="690"/></g><g><path class="ink" d="M120 600V290L330 170l180 120v310"/><path class="${a}" d="M510 600V330l165-94 205 124v240"/><line class="soft" x1="120" y1="430" x2="880" y2="430"/><rect class="ink" x="392" y="462" width="62" height="138"/><rect class="soft" x="195" y="355" width="82" height="62"/></g></svg>`;if(k===1)return `<svg viewBox="0 0 1000 760"><g><rect class="ink" x="165" y="132" width="670" height="500"/><line class="soft" x1="360" y1="132" x2="360" y2="632"/><line class="${a}" x1="610" y1="132" x2="610" y2="632"/><line class="soft" x1="165" y1="315" x2="835" y2="315"/><line class="soft" x1="165" y1="484" x2="835" y2="484"/><path class="${a}" d="M360 355h-56a56 56 0 0 1 56-56"/></g></svg>`;if(k===2)return `<svg viewBox="0 0 1000 760"><g><path class="ink" d="M255 250l245-130 245 130-245 130z"/><path class="soft" d="M255 250v260l245 130V380"/><path class="${a}" d="M745 250v260L500 640V380"/><path class="soft" d="M325 315l175-90 175 90-175 92z"/></g></svg>`;if(k===3)return `<svg viewBox="0 0 1000 760"><g><rect class="ink" x="145" y="118" width="710" height="520"/><path class="soft" d="M165 540C270 450 360 425 465 452s210 34 310-42 58-155 62-205"/><rect class="${a}" x="350" y="270" width="300" height="190"/><rect class="ink" x="410" y="322" width="175" height="88"/><circle class="soft" cx="265" cy="255" r="54"/></g></svg>`;if(k===4)return `<svg viewBox="0 0 1000 760"><g><circle class="${a}" cx="500" cy="385" r="74"/><circle class="ink" cx="245" cy="205" r="45"/><circle class="ink" cx="755" cy="205" r="45"/><circle class="ink" cx="245" cy="565" r="45"/><circle class="ink" cx="755" cy="565" r="45"/><line class="soft" x1="281" y1="230" x2="438" y2="341"/><line class="soft" x1="719" y1="230" x2="562" y2="341"/></g></svg>`;return `<svg viewBox="0 0 1000 760"><g><rect class="ink" x="112" y="292" width="150" height="86"/><rect class="soft" x="320" y="292" width="150" height="86"/><rect class="${a}" x="528" y="292" width="150" height="86"/><rect class="ink" x="736" y="292" width="92" height="86"/><line class="soft" x1="262" y1="335" x2="320" y2="335"/><line class="${a}" x1="470" y1="335" x2="528" y2="335"/><line class="ink" x1="678" y1="335" x2="736" y2="335"/></g></svg>`}DATA.forEach((d,i)=>{const s=document.createElement('section');s.dataset.i=i;s.dataset.mode=MODES[i%MODES.length];s.innerHTML=`<div class="space"><div class="plane a"></div><div class="plane b"></div><div class="plane c"></div><div class="light lo"></div><div class="light ls"></div>${svg(i)}</div><div class="copy"><div class="num">${String(i+1).padStart(2,'0')} / ${DATA.length}</div><h1>${d.title}</h1><div class="summary">${d.summary}</div><button class="more">Learn more</button></div>`;s.querySelector('.more').onclick=()=>{dt.textContent=d.title;body.innerHTML=`<h2>${d.title}</h2><p>${d.detail}</p>${i===0||i===DATA.length-1?'<p class="free"><strong>Free master:</strong> no setup fee or subscription is required. Nicholas-led implementation and ongoing consulting are optional.</p>':''}`;dlg.showModal()};main.appendChild(s);const n=document.createElement('a');n.href='#';n.innerHTML=`<i>${String(i+1).padStart(2,'0')}</i><span>${d.title}</span>`;n.onclick=e=>{e.preventDefault();main.scrollTo({top:s.offsetTop,behavior:'smooth'});nav.classList.remove('open')};nav.appendChild(n)});document.querySelector('.index').onclick=()=>nav.classList.add('open');document.querySelector('.navclose').onclick=()=>nav.classList.remove('open');document.querySelector('.close').onclick=()=>dlg.close();function cl(v,a=0,b=1){return Math.max(a,Math.min(b,v))}function sm(a,b,x){let t=cl((x-a)/(b-a));return t*t*(3-2*t)}function cam(m,p,f){let x=0,y=0,z=0,rx=0,ry=0,rz=0,sc=1;if(m==='right'){x=-70+140*p;ry=5-9*p;z=-55+75*f}else if(m==='left'){x=70-140*p;ry=-5+9*p;z=20-55*Math.abs(p-.5)*2}else if(m==='tilt'||m==='top'){rx=10-14*p;y=60-94*p;z=-85+105*f;sc=.975+.04*f}else if(m==='orbitR'){ry=-7+14*p;x=Math.sin(p*Math.PI)*24;z=-50+70*f}else if(m==='orbitL'){ry=7-14*p;x=-Math.sin(p*Math.PI)*24;z=-55+72*f}else if(m==='pull'){sc=1.06-.095*p;z=55-155*p}else if(m==='rise'){y=70-130*p;rx=-5+10*p;z=-70+88*f}else if(m==='cross'){x=-55+113*p;y=32-58*p;z=-72+102*f;ry=4-7.5*p}else if(m==='push'){sc=.955+.09*p;z=-145+217*p;ry=(p-.5)*5}else if(m==='twist'){rz=-1.2+2.4*p;ry=3.4-6.8*p;z=-55+79*f}else{z=-105+133*f;y=(p-.5)*24;rx=(p-.5)*2.4}return{x,y,z,rx,ry,rz,sc}}let tick=false;function render(){const H=main.clientHeight,max=Math.max(1,main.scrollHeight-H);document.querySelector('#progress').style.width=(main.scrollTop/max*100)+'%';let best,bf=-1;[...main.children].forEach((s,i)=>{const r=s.getBoundingClientRect(),mr=main.getBoundingClientRect(),top=r.top-mr.top,p=cl((H-top)/(H+r.height)),delta=top+r.height/2-H/2,f=cl(1-Math.abs(delta)/(H*.72)),va=sm(.02,.31,p)*(1-sm(.70,.98,p)),ta=sm(.18,.48,p)*(1-sm(.77,.99,p));if(f>bf){bf=f;best=s}const c=cam(s.dataset.mode,p,f);s.style.setProperty('--x',c.x+'px');s.style.setProperty('--y',c.y+'px');s.style.setProperty('--z',c.z+'px');s.style.setProperty('--rx',c.rx+'deg');s.style.setProperty('--ry',c.ry+'deg');s.style.setProperty('--rz',c.rz+'deg');s.style.setProperty('--sc',c.sc);s.style.setProperty('--vf',va);s.style.setProperty('--tf',ta);s.style.setProperty('--vb',(8.5*(1-va))+'px');s.style.setProperty('--tb',(5.2*(1-ta))+'px');s.style.setProperty('--lx',((-90+180*p)+(i%3-1)*20)+'px');s.style.setProperty('--ly',(Math.sin(p*Math.PI)*34-14)+'px')});if(best)cur.textContent=best.querySelector('h1').textContent;tick=false}main.onscroll=()=>{if(!tick){requestAnimationFrame(render);tick=true}};onresize=render;render();requestAnimationFrame(render);</script></body></html>
